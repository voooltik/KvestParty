<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Васильева Татьяна — организатор мероприятий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F6; --ink:#241B22; --muted:#6B6670; --line:#DAD8DD; --btn:#241B22; --btn-ink:#F3F4F6; --hover:#E8E6EA;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#17131A; --ink:#F1EEF2; --muted:#A39DA9; --line:#332D37; --btn:#F1EEF2; --btn-ink:#17131A; --hover:#241F28; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#17131A; --ink:#F1EEF2; --muted:#A39DA9; --line:#332D37; --btn:#F1EEF2; --btn-ink:#17131A; --hover:#241F28; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:440px;margin:0 auto;padding:0 0 48px}
.photo{margin:0;aspect-ratio:1/1;overflow:hidden;border-radius:0 0 32px 32px}
.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.info{padding:36px 28px 0}
h1{margin:0;font-weight:300;font-size:2.4rem;line-height:1.1;letter-spacing:-.02em}
.role{margin:12px 0 0;color:var(--muted);font-size:1.05rem;font-weight:400}
.links{margin:40px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.links li{border-bottom:1px solid var(--line)}
.links a{display:flex;align-items:center;gap:16px;padding:20px 4px;color:var(--ink);text-decoration:none;font-size:1.05rem;font-weight:400;transition:background .2s}
.links a:hover{background:var(--hover)}
.links a:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.links svg{width:26px;height:26px;flex:none;fill:currentColor}
.links span small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
@media (min-width:480px){main{margin-top:32px}.photo{border-radius:32px}}
</style>
</head>
